<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Confirmed | Vel Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --veltech-blue: #003366; --veltech-orange: #f37021; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .invoice-card {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 8px solid var(--veltech-orange);
        }
        .status-icon { color: #28a745; font-size: 50px; margin-bottom: 10px; }
        h2 { color: var(--veltech-blue); margin-bottom: 5px; }
        .receipt-line { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .label { font-weight: 600; color: #666; }
        .value { color: #333; font-weight: 700; }
        
        .print-btn {
            margin-top: 30px;
            background: var(--veltech-blue);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        @media print { .print-btn { display: none; } }
    </style>
</head>
<body>

<div class="invoice-card">
    <div class="status-icon">✓</div>
    <h2>Registration Successful!</h2>
    <p style="color: #666; font-size: 13px;">Please keep this receipt for your records.</p>
    
    <div style="margin-top: 20px; text-align: left;">
        <div class="receipt-line">
            <span class="label">Reference ID:</span>
            <span class="value" id="disp-ref">---</span>
        </div>
        <div class="receipt-line">
            <span class="label">Student Name:</span>
            <span class="value" id="disp-name">---</span>
        </div>
        <div class="receipt-line">
            <span class="label">Admission No:</span>
            <span class="value" id="disp-id">---</span>
        </div>
        <div class="receipt-line">
            <span class="label">Event:</span>
            <span class="value" id="disp-event" style="color: var(--veltech-orange);">---</span>
        </div>
        <div class="receipt-line">
            <span class="label">Email:</span>
            <span class="value" id="disp-email">---</span>
        </div>
    </div>

    <button class="print-btn" onclick="window.print()">Print Receipt</button>
    <p style="margin-top: 20px;"><a href="index.html" style="color: var(--veltech-blue); font-size: 12px;">Back to Home</a></p>
</div>

<script>
    // Get data from URL
    const params = new URLSearchParams(window.location.search);
    
    document.getElementById('disp-name').innerText = params.get('name');
    document.getElementById('disp-id').innerText = params.get('id');
    document.getElementById('disp-email').innerText = params.get('email');
    document.getElementById('disp-event').innerText = params.get('event');
    document.getElementById('disp-ref').innerText = params.get('ref');
</script>

</body>
</html>
